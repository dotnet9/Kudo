<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆角 -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="#512bd4"/>

  <!-- 三个节点 -->
  <circle cx="16" cy="20" r="6" fill="#ffffff"/>
  <circle cx="48" cy="20" r="6" fill="#ffffff"/>
  <circle cx="32" cy="44" r="6" fill="#ffffff"/>

  <!-- 三条连线 -->
  <line x1="16" y1="20" x2="48" y2="20" stroke="#ffffff" stroke-width="3"/>
  <line x1="16" y1="20" x2="32" y2="44" stroke="#ffffff" stroke-width="3"/>
  <line x1="48" y1="20" x2="32" y2="44" stroke="#ffffff" stroke-width="3"/>
</svg>
